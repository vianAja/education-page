<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="'Golos Text', Arial, sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="#0b1120" rx="16"/>

  <!-- Titles -->
  <text x="205" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Virtual Machine</text>
  <text x="615" y="42" text-anchor="middle" fill="#22d3ee" font-size="20" font-weight="700">Container (Docker)</text>

  <!-- ===================== LEFT: VM STACK ===================== -->
  <!-- Infrastructure -->
  <rect x="55" y="400" width="300" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="205" y="425" text-anchor="middle" fill="#cbd5e1" font-size="13">Infrastructure</text>

  <!-- Host OS -->
  <rect x="55" y="355" width="300" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="205" y="380" text-anchor="middle" fill="#cbd5e1" font-size="13">Host Operating System</text>

  <!-- Hypervisor -->
  <rect x="55" y="310" width="300" height="40" rx="6" fill="#3730a3" stroke="#4338ca"/>
  <text x="205" y="335" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="600">Hypervisor</text>

  <!-- 3 VM boxes each with Guest OS + Bin/Lib + App -->
  <g>
    <rect x="60" y="60" width="90" height="240" rx="6" fill="#111827" stroke="#334155"/>
    <rect x="70" y="220" width="70" height="70" rx="4" fill="#475569"/>
    <text x="105" y="260" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Guest OS</text>
    <rect x="70" y="150" width="70" height="55" rx="4" fill="#334155"/>
    <text x="105" y="182" text-anchor="middle" fill="#e2e8f0" font-size="10">Bins / Libs</text>
    <rect x="70" y="90" width="70" height="45" rx="4" fill="#0891b2"/>
    <text x="105" y="117" text-anchor="middle" fill="#f0fdfa" font-size="10.5" font-weight="600">App A</text>
  </g>
  <g>
    <rect x="160" y="60" width="90" height="240" rx="6" fill="#111827" stroke="#334155"/>
    <rect x="170" y="220" width="70" height="70" rx="4" fill="#475569"/>
    <text x="205" y="260" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Guest OS</text>
    <rect x="170" y="150" width="70" height="55" rx="4" fill="#334155"/>
    <text x="205" y="182" text-anchor="middle" fill="#e2e8f0" font-size="10">Bins / Libs</text>
    <rect x="170" y="90" width="70" height="45" rx="4" fill="#0891b2"/>
    <text x="205" y="117" text-anchor="middle" fill="#f0fdfa" font-size="10.5" font-weight="600">App B</text>
  </g>
  <g>
    <rect x="260" y="60" width="90" height="240" rx="6" fill="#111827" stroke="#334155"/>
    <rect x="270" y="220" width="70" height="70" rx="4" fill="#475569"/>
    <text x="305" y="260" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Guest OS</text>
    <rect x="270" y="150" width="70" height="55" rx="4" fill="#334155"/>
    <text x="305" y="182" text-anchor="middle" fill="#e2e8f0" font-size="10">Bins / Libs</text>
    <rect x="270" y="90" width="70" height="45" rx="4" fill="#0891b2"/>
    <text x="305" y="117" text-anchor="middle" fill="#f0fdfa" font-size="10.5" font-weight="600">App C</text>
  </g>

  <!-- divider -->
  <line x1="410" y1="20" x2="410" y2="460" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- ===================== RIGHT: CONTAINER STACK ===================== -->
  <rect x="465" y="400" width="300" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="615" y="425" text-anchor="middle" fill="#cbd5e1" font-size="13">Infrastructure</text>

  <rect x="465" y="355" width="300" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="615" y="380" text-anchor="middle" fill="#cbd5e1" font-size="13">Host Operating System</text>

  <rect x="465" y="310" width="300" height="40" rx="6" fill="#0e7490" stroke="#22d3ee"/>
  <text x="615" y="335" text-anchor="middle" fill="#ecfeff" font-size="13" font-weight="600">Docker Engine</text>

  <!-- 4 container boxes, no guest OS -> lebih ramping -->
  <g>
    <rect x="470" y="60" width="65" height="240" rx="6" fill="#111827" stroke="#164e63"/>
    <rect x="478" y="220" width="49" height="45" rx="4" fill="#334155"/>
    <text x="502" y="246" text-anchor="middle" fill="#e2e8f0" font-size="9">Bin/Lib</text>
    <rect x="478" y="140" width="49" height="70" rx="4" fill="#0891b2"/>
    <text x="502" y="178" text-anchor="middle" fill="#f0fdfa" font-size="10" font-weight="600">App A</text>
  </g>
  <g>
    <rect x="545" y="60" width="65" height="240" rx="6" fill="#111827" stroke="#164e63"/>
    <rect x="553" y="220" width="49" height="45" rx="4" fill="#334155"/>
    <text x="577" y="246" text-anchor="middle" fill="#e2e8f0" font-size="9">Bin/Lib</text>
    <rect x="553" y="140" width="49" height="70" rx="4" fill="#0891b2"/>
    <text x="577" y="178" text-anchor="middle" fill="#f0fdfa" font-size="10" font-weight="600">App B</text>
  </g>
  <g>
    <rect x="620" y="60" width="65" height="240" rx="6" fill="#111827" stroke="#164e63"/>
    <rect x="628" y="220" width="49" height="45" rx="4" fill="#334155"/>
    <text x="652" y="246" text-anchor="middle" fill="#e2e8f0" font-size="9">Bin/Lib</text>
    <rect x="628" y="140" width="49" height="70" rx="4" fill="#0891b2"/>
    <text x="652" y="178" text-anchor="middle" fill="#f0fdfa" font-size="10" font-weight="600">App C</text>
  </g>
  <g>
    <rect x="695" y="60" width="65" height="240" rx="6" fill="#111827" stroke="#164e63"/>
    <rect x="703" y="220" width="49" height="45" rx="4" fill="#334155"/>
    <text x="727" y="246" text-anchor="middle" fill="#e2e8f0" font-size="9">Bin/Lib</text>
    <rect x="703" y="140" width="49" height="70" rx="4" fill="#0891b2"/>
    <text x="727" y="178" text-anchor="middle" fill="#f0fdfa" font-size="10" font-weight="600">App D</text>
  </g>

  <text x="205" y="470" text-anchor="middle" fill="#64748b" font-size="11">Setiap VM bawa OS lengkap sendiri &#8594; berat</text>
  <text x="615" y="470" text-anchor="middle" fill="#67e8f9" font-size="11">Container berbagi kernel host &#8594; ringan &amp; cepat</text>
</svg>

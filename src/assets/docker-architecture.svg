<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Golos Text', Arial, sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#0b1120" rx="16"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Docker Client -->
  <rect x="30" y="150" width="170" height="100" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="115" y="185" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Docker Client</text>
  <text x="115" y="208" text-anchor="middle" fill="#94a3b8" font-size="11">docker build</text>
  <text x="115" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">docker run / pull</text>

  <!-- Arrow client -> daemon -->
  <line x1="200" y1="200" x2="288" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="244" y="190" text-anchor="middle" fill="#67e8f9" font-size="10">REST API</text>

  <!-- Docker Host / Daemon -->
  <rect x="290" y="60" width="280" height="280" rx="10" fill="#0f172a" stroke="#0e7490" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="700">Docker Host (dockerd)</text>

  <rect x="315" y="115" width="105" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="367" y="145" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Images</text>
  <text x="367" y="165" text-anchor="middle" fill="#94a3b8" font-size="9.5">nginx:latest</text>
  <text x="367" y="180" text-anchor="middle" fill="#94a3b8" font-size="9.5">myapp:1.0</text>

  <rect x="435" y="115" width="105" height="90" rx="8" fill="#164e63" stroke="#22d3ee"/>
  <text x="487" y="145" text-anchor="middle" fill="#ecfeff" font-size="12" font-weight="600">Containers</text>
  <text x="487" y="165" text-anchor="middle" fill="#a5f3fc" font-size="9.5">web-1 (running)</text>
  <text x="487" y="180" text-anchor="middle" fill="#a5f3fc" font-size="9.5">db-1 (running)</text>

  <rect x="315" y="225" width="225" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="427" y="255" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Volumes &amp; Network</text>
  <text x="427" y="278" text-anchor="middle" fill="#94a3b8" font-size="9.5">Penyimpanan data yang persist</text>
  <text x="427" y="294" text-anchor="middle" fill="#94a3b8" font-size="9.5">walau container dihapus</text>

  <!-- Arrow daemon <-> registry -->
  <line x1="570" y1="150" x2="655" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="230" x2="570" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="140" text-anchor="middle" fill="#67e8f9" font-size="10">push</text>
  <text x="612" y="248" text-anchor="middle" fill="#94a3b8" font-size="10">pull</text>

  <!-- Registry -->
  <rect x="655" y="120" width="140" height="160" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="725" y="155" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Registry</text>
  <text x="725" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">Docker Hub /</text>
  <text x="725" y="194" text-anchor="middle" fill="#94a3b8" font-size="11">private registry</text>
  <circle cx="725" cy="225" r="18" fill="#0891b2"/>
  <text x="725" y="230" text-anchor="middle" fill="#f0fdfa" font-size="14" font-weight="700">&#128230;</text>

  <text x="410" y="375" text-anchor="middle" fill="#64748b" font-size="11.5">
    Client mengirim perintah &#8594; Daemon mengeksekusi &amp; mengatur image/container &#8594; image diambil dari Registry
  </text>
</svg>
